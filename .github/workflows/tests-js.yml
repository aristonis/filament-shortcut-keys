name: tests-js

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    name: client

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Nothing is installed and nothing is built: the tests import the source modules directly and
      # stub the DOM by hand, so the only dependency is node itself. One job is enough — this code
      # runs in a browser, so the PHP matrix has no bearing on it.
      - name: Execute tests
        run: node --test "tests/js/**/*.test.mjs"

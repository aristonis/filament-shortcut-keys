name: tests-js

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    name: client

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Nothing is installed and nothing is built: the tests import the source modules directly and
      # stub the DOM by hand, so the only dependency is node itself. One job is enough — this code
      # runs in a browser, so the PHP matrix has no bearing on it.
      - name: Execute tests
        run: node --test "tests/js/**/*.test.mjs"
